name: Publish Nghia Client v9.4.1 Final Hotfix

on:
  push:
    branches: [build-v9.4.1]
    paths: ["publish-v9.4.1-final-trigger.txt"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  REPO: bachlangcomic-creator/maplenghia
  BUILD_RUN_ID: "34634120184"
  VERIFY_RUN_ID: "34634816205"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build-v9.4.1
          fetch-depth: 0

      - name: Require green real-Windows verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view "$BUILD_RUN_ID" --repo "$REPO" --json status,conclusion --jq 'if .status != "completed" or .conclusion != "success" then error("launcher build not green") else . end'
          gh run view "$VERIFY_RUN_ID" --repo "$REPO" --json status,conclusion --jq 'if .status != "completed" or .conclusion != "success" then error("real default-launch verification not green") else . end'

      - name: Download fixed launcher and v9.4.0 production inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p hotfix base
          gh run download "$BUILD_RUN_ID" --repo "$REPO" -n Nghia-V9.4.1-Fixed-Launcher -D hotfix
          gh release download v9.4.0 --repo "$REPO" -p NghiaClient_V9.4.0_Portable.zip -p NghiaEdition_Update_v9.4.0.zip -D base
          test -f hotfix/NghiaLauncher.exe
          test -f base/NghiaClient_V9.4.0_Portable.zip
          test -f base/NghiaEdition_Update_v9.4.0.zip

      - name: Assemble and validate v9.4.1 packages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf portable update out verify
          mkdir -p portable update out verify
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile

          def safe_extract(src, dst):
              dst=Path(dst).resolve()
              with zipfile.ZipFile(src) as z:
                  for info in z.infolist():
                      target=(dst/info.filename).resolve()
                      if target != dst and dst not in target.parents:
                          raise SystemExit(f'unsafe archive entry: {info.filename}')
                  z.extractall(dst)

          safe_extract('base/NghiaClient_V9.4.0_Portable.zip','portable')
          safe_extract('base/NghiaEdition_Update_v9.4.0.zip','update')
          shutil.copy2('hotfix/NghiaLauncher.exe','portable/NghiaLauncher.exe')

          cfgp=Path('portable/launcher_config.json')
          cfg=json.loads(cfgp.read_text(encoding='utf-8'))
          cfg['launcher_version']='1.0.1'
          cfgp.write_text(json.dumps(cfg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path('portable/version.json').write_text(json.dumps({'version':'9.4.1'},indent=2)+'\n',encoding='utf-8')
          crash=Path('portable/user_data/launcher_crash.log')
          if crash.exists(): crash.unlink()

          rp=Path('update/release.json')
          rel=json.loads(rp.read_text(encoding='utf-8'))
          rel['version']='9.4.1'
          rp.write_text(json.dumps(rel,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          def zip_tree(root, out):
              root=Path(root)
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(root.rglob('*')):
                      if p.is_file(): z.write(p,p.relative_to(root).as_posix())

          zip_tree('portable','out/NghiaClient_V9.4.1_Portable.zip')
          zip_tree('update','out/NghiaEdition_Update_v9.4.1.zip')

          portable=Path('out/NghiaClient_V9.4.1_Portable.zip')
          update=Path('out/NghiaEdition_Update_v9.4.1.zip')
          assert portable.stat().st_size > 1_000_000
          assert update.stat().st_size > 1_000_000
          with zipfile.ZipFile(portable) as z:
              names=set(z.namelist())
              for name in ('NghiaLauncher.exe','launcher_config.json','version.json','launcher/nghia_launcher.py','app_payload/NghiaClientApp.exe','app_payload/nghia_spotify_nologin.py'):
                  assert name in names, name
              assert z.read('NghiaLauncher.exe')[:2] == b'MZ'
              assert json.loads(z.read('version.json'))['version']=='9.4.1'
              assert json.loads(z.read('launcher_config.json'))['launcher_version']=='1.0.1'
          with zipfile.ZipFile(update) as z:
              names=set(z.namelist())
              for name in ('release.json','app_payload/NghiaClientApp.exe','app_payload/nghia_spotify_nologin.py','app_payload/spotify_recovered_core.py'):
                  assert name in names, name
              assert json.loads(z.read('release.json'))['version']=='9.4.1'

          update_sha=hashlib.sha256(update.read_bytes()).hexdigest()
          portable_sha=hashlib.sha256(portable.read_bytes()).hexdigest()
          manifest={
            'version':'9.4.1','channel':'stable',
            'package_url':'https://github.com/bachlangcomic-creator/maplenghia/releases/download/v9.4.1/NghiaEdition_Update_v9.4.1.zip',
            'url':'https://github.com/bachlangcomic-creator/maplenghia/releases/download/v9.4.1/NghiaEdition_Update_v9.4.1.zip',
            'sha256':update_sha,'payload_dir':'app_payload','min_launcher_version':'1.0.1',
            'notes':'Launcher startup hotfix. v9.4.0 requires one-time manual portable redownload; future updates work from v9.4.1.'
          }
          Path('out/latest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('UPDATE_SHA256='+update_sha)
          print('PORTABLE_SHA256='+portable_sha)
          PY

      - name: Create public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v9.4.1 --repo "$REPO" >/dev/null 2>&1; then
            echo 'v9.4.1 already exists; refusing overwrite'; exit 1
          fi
          gh release create v9.4.1 \
            out/NghiaClient_V9.4.1_Portable.zip \
            out/NghiaEdition_Update_v9.4.1.zip \
            --repo "$REPO" --target main \
            --title 'Nghia Client v9.4.1 - Launcher Hotfix' \
            --notes 'Fixes v9.4.0 silent NghiaLauncher startup failure caused by package-context imports. v9.4.1 also records user_data/launcher_crash.log and shows an error dialog on bootstrap failure. Because the v9.4.0 launcher itself cannot start, download v9.4.1 Portable once manually. Future updates can use the CẬP NHẬT button.'

      - name: Re-download public assets and verify SHA-256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v9.4.1 --repo "$REPO" -p NghiaClient_V9.4.1_Portable.zip -p NghiaEdition_Update_v9.4.1.zip -D verify
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          m=json.loads(Path('out/latest.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(Path('verify/NghiaEdition_Update_v9.4.1.zip').read_bytes()).hexdigest()==m['sha256']
          assert hashlib.sha256(Path('verify/NghiaClient_V9.4.1_Portable.zip').read_bytes()).hexdigest()==hashlib.sha256(Path('out/NghiaClient_V9.4.1_Portable.zip').read_bytes()).hexdigest()
          print('PUBLIC_ASSETS_SHA_OK')
          PY

      - name: Publish latest.json to main LAST
        shell: bash
        run: |
          set -euo pipefail
          cp out/latest.json /tmp/latest.json
          git fetch origin main
          git switch main
          cp /tmp/latest.json latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add latest.json
          git commit -m 'release: publish v9.4.1 launcher hotfix manifest'
          git push origin main

      - name: Verify production release and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v9.4.1 --repo "$REPO" --json isDraft,isPrerelease,tagName,url --jq 'if .isDraft or .isPrerelease or .tagName != "v9.4.1" then error("release not stable") else . end'
          gh api "repos/$REPO/contents/latest.json?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/published.json
          python - <<'PY'
          from pathlib import Path
          import json
          expected=json.loads(Path('/tmp/latest.json').read_text(encoding='utf-8'))
          actual=json.loads(Path('/tmp/published.json').read_text(encoding='utf-8'))
          assert actual==expected
          assert actual['version']=='9.4.1'
          assert actual['min_launcher_version']=='1.0.1'
          print('PRODUCTION_V941_OK')
          PY
