name: Build Nghia Launcher v9.4.1 Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - build-v9.4.1
    paths:
      - "ci/launcher_bootstrap.py"
      - ".github/workflows/build-v9.4.1-hotfix.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install launcher build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard "requests>=2.32,<3"

      - name: Build NghiaLauncher.exe hotfix
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m nuitka `
            --onefile `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --include-package=requests `
            --include-package=urllib `
            --include-module=argparse `
            --include-module=dataclasses `
            --include-module=datetime `
            --include-module=hashlib `
            --include-module=hmac `
            --include-module=importlib `
            --include-module=json `
            --include-module=secrets `
            --include-module=shutil `
            --include-module=stat `
            --include-module=subprocess `
            --include-module=threading `
            --include-module=traceback `
            --include-module=zipfile `
            --output-filename=NghiaLauncher.exe `
            --output-dir=dist `
            --remove-output `
            ci/launcher_bootstrap.py
          if (!(Test-Path "dist/NghiaLauncher.exe")) { throw "NghiaLauncher.exe was not produced" }
          $bytes = [IO.File]::ReadAllBytes("dist/NghiaLauncher.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Launcher EXE missing MZ header" }

      - name: Download production v9.4.0 portable client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v9.4.0 --repo bachlangcomic-creator/maplenghia -p NghiaClient_V9.4.0_Portable.zip -D prod
          Expand-Archive -LiteralPath prod/NghiaClient_V9.4.0_Portable.zip -DestinationPath smoke-real -Force
          Copy-Item dist/NghiaLauncher.exe smoke-real/NghiaLauncher.exe -Force

      - name: Real-package check-only smoke
        shell: pwsh
        run: |
          $exe = (Resolve-Path "smoke-real/NghiaLauncher.exe").Path
          $proc = Start-Process -FilePath $exe -ArgumentList "--check-only" -WorkingDirectory (Resolve-Path "smoke-real").Path -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Launcher --check-only exited with code $($proc.ExitCode)" }
          $status = "smoke-real/user_data/update_status.json"
          if (!(Test-Path $status)) { throw "Real launcher did not create update_status.json" }
          Get-Content $status
          if (Test-Path "smoke-real/user_data/launcher_crash.log") {
            Get-Content "smoke-real/user_data/launcher_crash.log"
            throw "Launcher produced launcher_crash.log during check-only smoke"
          }

      - name: Real-package default launch smoke
        shell: pwsh
        run: |
          $root = (Resolve-Path "smoke-real").Path
          $exe = Join-Path $root "NghiaLauncher.exe"
          $proc = Start-Process -FilePath $exe -WorkingDirectory $root -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Launcher default mode exited with code $($proc.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(25)
          $found = $false
          while ((Get-Date) -lt $deadline) {
            $apps = Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue
            if ($apps) { $found = $true; break }
            Start-Sleep -Milliseconds 500
          }
          if (!$found) {
            if (Test-Path "smoke-real/user_data/launcher_crash.log") { Get-Content "smoke-real/user_data/launcher_crash.log" }
            throw "Launcher returned success but real NghiaClientApp did not remain running"
          }
          Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Upload hotfix launcher
        uses: actions/upload-artifact@v4
        with:
          name: NghiaLauncher-v9.4.1-Hotfix
          path: dist/NghiaLauncher.exe
          if-no-files-found: error
          retention-days: 7
