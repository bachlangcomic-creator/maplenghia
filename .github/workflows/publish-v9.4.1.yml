name: Publish Nghia Client v9.4.1 Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - build-v9.4.1
    paths:
      - "publish-trigger-v9.4.1.txt"

permissions:
  contents: write

env:
  VERSION: "9.4.1"
  LAUNCHER_VERSION: "1.0.1"
  REPO: "bachlangcomic-creator/maplenghia"

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: build-v9.4.1
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install launcher build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard "requests>=2.32,<3"

      - name: Build fixed NghiaLauncher.exe in publication job
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m nuitka `
            --onefile `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --include-package=requests `
            --include-package=urllib `
            --include-module=argparse `
            --include-module=dataclasses `
            --include-module=datetime `
            --include-module=hashlib `
            --include-module=hmac `
            --include-module=json `
            --include-module=secrets `
            --include-module=shutil `
            --include-module=stat `
            --include-module=subprocess `
            --include-module=threading `
            --include-module=zipfile `
            --output-filename=NghiaLauncher.exe `
            --output-dir=dist `
            --remove-output `
            ci/launcher_bootstrap.py
          if (!(Test-Path "dist/NghiaLauncher.exe")) { throw "NghiaLauncher.exe was not produced" }
          $bytes = [IO.File]::ReadAllBytes("dist/NghiaLauncher.exe")
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A -or $bytes.Length -lt 1048576) { throw "Invalid hotfix launcher EXE" }

      - name: Download public v9.4.0 portable client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base | Out-Null
          gh release view v9.4.0 --repo $env:REPO --json isDraft,isPrerelease,tagName --jq 'if .isDraft or .isPrerelease or .tagName != "v9.4.0" then error("v9.4.0 base is not public stable") else . end'
          gh release download v9.4.0 --repo $env:REPO -p NghiaClient_V9.4.0_Portable.zip -D base
          if (!(Test-Path "base/NghiaClient_V9.4.0_Portable.zip")) { throw "Base portable ZIP is missing" }
          Expand-Archive -LiteralPath "base/NghiaClient_V9.4.0_Portable.zip" -DestinationPath "dist_client" -Force
          Copy-Item "dist/NghiaLauncher.exe" "dist_client/NghiaLauncher.exe" -Force

      - name: Stamp v9.4.1 launcher metadata without touching app payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('dist_client')
          def tree_digest(base: Path) -> str:
              h=hashlib.sha256()
              for p in sorted(x for x in base.rglob('*') if x.is_file()):
                  rel=p.relative_to(base).as_posix().encode()
                  h.update(len(rel).to_bytes(4,'big')); h.update(rel)
                  data=p.read_bytes(); h.update(len(data).to_bytes(8,'big')); h.update(data)
              return h.hexdigest()
          app=root/'app_payload'
          before=tree_digest(app)
          cfg=json.loads((root/'launcher_config.json').read_text(encoding='utf-8'))
          cfg['launcher_version']='1.0.1'
          (root/'launcher_config.json').write_text(json.dumps(cfg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (root/'version.json').write_text(json.dumps({'version':'9.4.1'},indent=2)+'\n',encoding='utf-8')
          after=tree_digest(app)
          if before != after: raise SystemExit('app_payload changed while stamping launcher hotfix')
          for p in [root/'NghiaLauncher.exe',root/'launcher/nghia_launcher.py',root/'app_payload/NghiaClientApp.exe',root/'app_payload/nghia_spotify_nologin.py',root/'app_payload/spotify_recovered_core.py']:
              if not p.is_file(): raise SystemExit(f'Missing required portable file: {p}')
          print('APP_PAYLOAD_UNCHANGED_SHA256='+after)
          PY

      - name: Smoke fixed launcher against the real v9.4.1 portable tree
        shell: pwsh
        run: |
          $root = (Resolve-Path "dist_client").Path
          $proc = Start-Process -FilePath (Join-Path $root "NghiaLauncher.exe") -ArgumentList @("--check-only", "--root", $root) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Fixed launcher exited with code $($proc.ExitCode)" }
          $statusPath = Join-Path $root "user_data/update_status.json"
          if (!(Test-Path $statusPath)) { throw "Fixed launcher did not execute real launcher package" }
          $status = Get-Content -Raw -LiteralPath $statusPath | ConvertFrom-Json
          $allowed = @("up_to_date", "update_available", "offline_or_error", "launcher_update_required")
          if ($allowed -notcontains $status.state) { throw "Unexpected launcher state: $($status.state)" }
          if ($status.local_version -ne "9.4.1") { throw "Wrong root/version resolution: $($status.local_version)" }
          Write-Host "REAL_V941_LAUNCHER_SMOKE_OK state=$($status.state) local=$($status.local_version)"

      - name: Build v9.4.1 portable ZIP, update ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out update_root verify
          mkdir -p out update_root/app_payload verify
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, zipfile
          client=Path('dist_client')
          portable=Path('out/NghiaClient_V9.4.1_Portable.zip')
          with zipfile.ZipFile(portable,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(client.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(client).as_posix())
          shutil.copytree(client/'app_payload',Path('update_root/app_payload'),dirs_exist_ok=True)
          required=['NghiaClientApp.exe','nghia_spotify_nologin.py','maple_nghia_pro.py','spotify_recovered_core.py','spotify_behavior_engine.py','spotify_miumiu_sell.py','spotify_pc_alarm.py']
          release={'payload_dir':'app_payload','required_files':required,'version':'9.4.1'}
          Path('update_root/release.json').write_text(json.dumps(release,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          update=Path('out/NghiaEdition_Update_v9.4.1.zip')
          root=Path('update_root')
          with zipfile.ZipFile(update,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root).as_posix())
          digest=hashlib.sha256(update.read_bytes()).hexdigest()
          manifest={
              'version':'9.4.1','channel':'stable',
              'package_url':'https://github.com/bachlangcomic-creator/maplenghia/releases/download/v9.4.1/NghiaEdition_Update_v9.4.1.zip',
              'url':'https://github.com/bachlangcomic-creator/maplenghia/releases/download/v9.4.1/NghiaEdition_Update_v9.4.1.zip',
              'sha256':digest,'payload_dir':'app_payload','min_launcher_version':'1.0.1',
              'notes':'Launcher startup hotfix; C2 Fast Worker, MiuMiu and PC Alarm unchanged'
          }
          Path('out/latest.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print('UPDATE_SHA256='+digest)
          print('PORTABLE_SHA256='+hashlib.sha256(portable.read_bytes()).hexdigest())
          PY

      - name: Validate final archives before release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          update=Path('out/NghiaEdition_Update_v9.4.1.zip'); portable=Path('out/NghiaClient_V9.4.1_Portable.zip')
          manifest=json.loads(Path('out/latest.json').read_text(encoding='utf-8'))
          for p in (update,portable):
              if not p.is_file() or p.stat().st_size < 1_000_000: raise SystemExit(f'Invalid archive: {p}')
          if hashlib.sha256(update.read_bytes()).hexdigest()!=manifest['sha256']: raise SystemExit('Manifest SHA mismatch')
          with zipfile.ZipFile(update) as z:
              names=set(z.namelist())
              for n in ('release.json','app_payload/NghiaClientApp.exe','app_payload/nghia_spotify_nologin.py','app_payload/spotify_recovered_core.py'):
                  if n not in names: raise SystemExit(f'Missing update member: {n}')
              if json.loads(z.read('release.json').decode())['version']!='9.4.1': raise SystemExit('Wrong release version')
          with zipfile.ZipFile(portable) as z:
              names=set(z.namelist())
              for n in ('NghiaLauncher.exe','version.json','launcher_config.json','launcher/nghia_launcher.py','app_payload/NghiaClientApp.exe'):
                  if n not in names: raise SystemExit(f'Missing portable member: {n}')
              if json.loads(z.read('version.json').decode())['version']!='9.4.1': raise SystemExit('Wrong portable version')
              if json.loads(z.read('launcher_config.json').decode())['launcher_version']!='1.0.1': raise SystemExit('Wrong launcher_version')
          print('FINAL_ARCHIVES_OK')
          PY

      - name: Ensure v9.4.1 does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v9.4.1 --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v9.4.1 already exists; refusing to overwrite" }
          $global:LASTEXITCODE = 0

      - name: Create public v9.4.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v9.4.1 out/NghiaEdition_Update_v9.4.1.zip out/NghiaClient_V9.4.1_Portable.zip --repo $env:REPO --target main --title "Nghia Client v9.4.1" --notes "Launcher startup hotfix. Fixes NghiaLauncher.exe closing immediately because launcher/nghia_launcher.py was executed without package context. C2 Fast Worker, Spotify MiuMiu and PC Alarm are unchanged. v9.4.0 users must download the v9.4.1 portable client once; future payload updates can use the CẬP NHẬT button."
          if ($LASTEXITCODE -ne 0) { throw "Failed to create v9.4.1 release" }

      - name: Re-download public update asset and verify SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v9.4.1 --repo $env:REPO -p NghiaEdition_Update_v9.4.1.zip -D verify
          if ($LASTEXITCODE -ne 0) { throw "Failed to re-download public update asset" }
          python -c "from pathlib import Path; import hashlib,json; m=json.loads(Path('out/latest.json').read_text(encoding='utf-8')); d=hashlib.sha256(Path('verify/NghiaEdition_Update_v9.4.1.zip').read_bytes()).hexdigest(); assert d==m['sha256'], (d,m['sha256']); print('PUBLIC_RELEASE_SHA256_OK='+d)"

      - name: Publish latest.json to main LAST
        shell: pwsh
        run: |
          Copy-Item out/latest.json $env:TEMP/latest-v941.json -Force
          git fetch origin main
          git switch main
          Copy-Item $env:TEMP/latest-v941.json latest.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "release: publish v9.4.1 launcher hotfix"
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish latest.json" }

      - name: Verify public stable release and published manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v9.4.1 --repo $env:REPO --json isDraft,isPrerelease,tagName,url --jq 'if .isDraft or .isPrerelease or .tagName != "v9.4.1" then error("release is not public stable v9.4.1") else . end'
          if ($LASTEXITCODE -ne 0) { throw "Public release verification failed" }
          gh api "repos/$env:REPO/contents/latest.json?ref=main" --jq .content | Out-File -Encoding ascii $env:TEMP/latest-b64.txt
          python -c "from pathlib import Path; import base64,json; exp=json.loads(Path(r'$env:TEMP/latest-v941.json').read_text(encoding='utf-8')); raw=''.join(Path(r'$env:TEMP/latest-b64.txt').read_text().split()); act=json.loads(base64.b64decode(raw).decode()); assert act==exp; print('PUBLISHED_LATEST_JSON_OK')"
