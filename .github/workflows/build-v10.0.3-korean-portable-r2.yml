name: Build Nghia V10.0.3 Korean Portable OCR R2

on:
  workflow_dispatch:
  push:
    branches: [build/v10.0.3-korean-portable]
    paths:
      - '.github/workflows/build-v10.0.3-korean-portable-r2.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Prepare verified V10.0.0 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build_input/v1001_prepare.ps1

      - name: Reproduce verified V10.0.1 source
        shell: pwsh
        run: python build_input/apply_v1001.py

      - name: Apply V10.0.2 canonical runtime
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git config core.safecrlf false
          python build_input/apply_v1002.py

      - name: Apply V10.0.3 Loot parity defense
        shell: pwsh
        run: python build_input/apply_v1003.py

      - name: Verify untouched V10.0.3 baseline
        shell: pwsh
        run: python build_input/v1003_verify.py

      - name: Apply Korean Question Helper
        shell: pwsh
        run: python build_input/apply_v1003_korean_portable.py

      - name: Install Python and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest "nuitka>=2.7,<3" ordered-set zstandard

      - name: Verify Korean helper source and locked core
        shell: pwsh
        run: |
          python -m compileall -q portable/app_payload
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          @'
          from pathlib import Path
          import hashlib
          root=Path('portable/app_payload')
          def sha(name): return hashlib.sha256((root/name).read_bytes()).hexdigest()
          assert sha('maple_nghia_pro.py') == '020770a55f5f59b4be1ce07c8de28eee15019070146b593c23ed3a1d56349ea4'
          assert sha('nghia_spotify_nologin.py') == '43c4935952966297be4ed71cc159d744e3177ccc26a0e8027ff1f68350955ab1'
          assert sha('korean_question_helper.py') == '94e422ca8a48d3133bd42cce064fb4beee59af27740b668dfc90f147fbcca0d5'
          assert 'pytesseract' in (root/'requirements.txt').read_text(encoding='utf-8')
          ui=(root/'nghia_spotify_nologin.py').read_text(encoding='utf-8')
          assert 'DỊCH CÂU HỎI HÀN' in ui
          assert 'F10' in ui
          print('V1003_KOREAN_SOURCE_GUARDS_OK')
          '@ | python -

      - name: Stage and verify bundled Korean OCR engine
        shell: pwsh
        run: |
          ./build_input/v1003_korean_prepare_tesseract.ps1
          Push-Location portable/app_payload
          try {
            $env:TESSERACT_CMD=(Resolve-Path 'tesseract/tesseract.exe').Path
            @'
            from pathlib import Path
            import pytesseract
            import korean_question_helper as k
            cmd=k._find_tesseract_cmd()
            assert cmd and Path(cmd).name.lower() == 'tesseract.exe', cmd
            tessdata=k.configure_tesseract_runtime(cmd)
            assert Path(tessdata, 'kor.traineddata').is_file()
            assert Path(tessdata, 'eng.traineddata').is_file()
            pytesseract.pytesseract.tesseract_cmd=cmd
            langs=set(pytesseract.get_languages(config=''))
            assert {'kor','eng'} <= langs, langs
            print('KOREAN_HELPER_PORTABLE_OCR_RUNTIME_OK', cmd, sorted(langs))
            '@ | python -
          }
          finally { Pop-Location }

      - name: Build Windows onefile client with embedded Tesseract
        shell: pwsh
        run: ./build_input/v1003_korean_build.ps1

      - name: Smoke Windows launcher
        shell: pwsh
        run: ./build_input/v1001_smoke.ps1 -Root portable

      - name: Package portable Windows candidate
        shell: pwsh
        run: |
          Remove-Item portable/app_payload/dist_nuitka -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem portable -Directory -Recurse -Filter '__pycache__' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force out | Out-Null
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json
          root=Path('portable')
          out=Path('out')
          target=out/'NghiaClient_V10.0.3_KoreanHelper_PortableOCR_Windows.zip'
          with ZipFile(target,'w',ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p,p.relative_to(root).as_posix())
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          report={
              'version':'10.0.3',
              'variant':'KoreanHelperPortableOCR',
              'locked_core_sha256':'020770a55f5f59b4be1ce07c8de28eee15019070146b593c23ed3a1d56349ea4',
              'ui_sha256':'43c4935952966297be4ed71cc159d744e3177ccc26a0e8027ff1f68350955ab1',
              'helper_sha256':'94e422ca8a48d3133bd42cce064fb4beee59af27740b668dfc90f147fbcca0d5',
              'bundled_tesseract':True,
              'bundled_kor_traineddata':True,
              'bundled_eng_traineddata':True,
              'runtime_download_required':False,
              'nuitka_onefile_client':True,
              'launcher_smoke':True,
              'portable_sha256':digest,
          }
          (out/'korean_portable_preflight.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          (out/'korean_portable_sha256.txt').write_text(f'{digest}  {target.name}\n',encoding='utf-8')
          print('KOREAN_PORTABLE_PACKAGE_OK',target,digest,target.stat().st_size)
          '@ | python -

      - name: Verify packaged files
        shell: pwsh
        run: |
          Expand-Archive out/NghiaClient_V10.0.3_KoreanHelper_PortableOCR_Windows.zip -DestinationPath verify_korean -Force
          if (!(Test-Path verify_korean/NghiaLauncher.exe)) { throw 'NghiaLauncher.exe missing from package' }
          if (!(Test-Path verify_korean/app_payload/NghiaClientApp.exe)) { throw 'NghiaClientApp.exe missing from package' }
          if (!(Test-Path verify_korean/app_payload/tesseract/tesseract.exe)) { throw 'bundled tesseract.exe missing from package' }
          if (!(Test-Path verify_korean/app_payload/tesseract/tessdata/kor.traineddata)) { throw 'kor.traineddata missing from package' }
          if (!(Test-Path verify_korean/app_payload/tesseract/tessdata/eng.traineddata)) { throw 'eng.traineddata missing from package' }
          ./build_input/v1001_smoke.ps1 -Root verify_korean
          Write-Host 'PACKAGED_KOREAN_PORTABLE_SMOKE_OK'

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nghia-V10.0.3-KoreanHelper-PortableOCR-Windows
          path: |
            out/NghiaClient_V10.0.3_KoreanHelper_PortableOCR_Windows.zip
            out/korean_portable_preflight.json
            out/korean_portable_sha256.txt
          if-no-files-found: error
          retention-days: 14
