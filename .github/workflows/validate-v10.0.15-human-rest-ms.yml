name: Validate V10.0.15 Human Rest ms

on:
  push:
    branches: [v10.0.15-human-rest-ms]
    paths:
      - '.github/workflows/validate-v10.0.15-human-rest-ms.yml'
      - 'build_input/v1015_*'
      - 'build_input/test_v1015_human_rest_ms.py'

permissions:
  contents: read

jobs:
  red-green-regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Prepare verified V10.0.14 stable base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base | Out-Null
          gh release download v10.0.14 --repo $env:GITHUB_REPOSITORY `
            -p NghiaClient_V10.0.14_SellTriggerArbitration_Windows.zip -D base
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.14 base download failed' }
          $zip='base/NghiaClient_V10.0.14_SellTriggerArbitration_Windows.zip'
          $got=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='453f566e6b2d5538cd301e07fee93fa956d7908eb86fb800a4097cf3a379ba2f'
          if ($got -ne $expected) { throw "V10.0.14 base hash mismatch $got" }
          Expand-Archive $zip -DestinationPath portable -Force

      - name: Install pytest
        shell: pwsh
        run: python -m pip install pytest

      - name: Run V10.0.15 behavior test against base
        shell: pwsh
        env:
          NGHIA_APP_DIR: portable/app_payload
        run: python -m pytest -q build_input/test_v1015_human_rest_ms.py
