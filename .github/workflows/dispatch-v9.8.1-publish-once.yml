name: Dispatch V9.8.1 Publish Once

on:
  push:
    branches:
      - release-v9.8.1-hold-combo-parity
    paths:
      - .github/workflows/dispatch-v9.8.1-publish-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official V9.8.1 publisher with publish=true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-v9.8.1.yml \
            --repo bachlangcomic-creator/maplenghia \
            --ref release-v9.8.1-hold-combo-parity \
            -f publish=true
