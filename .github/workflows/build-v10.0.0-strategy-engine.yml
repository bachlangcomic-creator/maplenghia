name: Build Nghia V10.0.0 Isolated Strategy Engine Windows Candidate

on:
  push:
    branches: [build-v10.0.0-strategy-engine]
    paths:
      - '.github/workflows/build-v10.0.0-strategy-engine.yml'
      - 'build_input/nghia_strategy_v10.py'
      - 'build_input/apply_v1000.py'
      - 'build_input/v1000_prepare.ps1'
      - 'build_input/v1000_verify.py'
      - 'build_input/v1000_build.ps1'
      - 'build_input/v1000_smoke.ps1'
      - 'build_input/v1000_package.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Prepare verified V9.9.8 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build_input/v1000_prepare.ps1

      - name: RED isolation guard
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          root=Path('portable/app_payload')
          assert not (root/'nghia_strategy_v10.py').exists()
          t=(root/'maple_nghia_pro.py').read_text(encoding='utf-8')
          assert 'V10 PIRATE ROUTE' not in t
          assert 'V10StrategyEngine(self)' not in t
          print('V1000_RED_CONFIRMED')
          '@ | python -

      - name: Apply V10.0.0 isolated source transform
        shell: pwsh
        run: python build_input/apply_v1000.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest "nuitka>=2.7,<3" ordered-set zstandard

      - name: GREEN strategy and isolation tests
        shell: pwsh
        run: |
          python -m compileall -q portable/app_payload
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          python build_input/v1000_verify.py

      - name: Build Windows exe
        shell: pwsh
        run: ./build_input/v1000_build.ps1

      - name: Smoke Windows launcher
        shell: pwsh
        run: ./build_input/v1000_smoke.ps1 -Root portable

      - name: Package V10.0.0
        shell: pwsh
        run: python build_input/v1000_package.py

      - name: Smoke packaged candidate
        shell: pwsh
        run: |
          Expand-Archive out/NghiaClient_V10.0.0_IsolatedStrategyEngine_Windows_Candidate.zip -DestinationPath verify -Force
          ./build_input/v1000_smoke.ps1 -Root verify
          @'
          from pathlib import Path
          import json
          p=Path('out/preflight_report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          r['packaged_launcher_smoke']=True
          p.write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload V10.0.0 Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Nghia-V10.0.0-IsolatedStrategyEngine-Windows-Candidate
          path: |
            out/NghiaClient_V10.0.0_IsolatedStrategyEngine_Windows_Candidate.zip
            out/preflight_report.json
            out/preflight_hashes.txt
          if-no-files-found: error
          retention-days: 14
