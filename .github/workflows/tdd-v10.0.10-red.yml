name: TDD RED V10.0.10 Custom Map Parity

on:
  push:
    branches: [v10.0.10-custom-map-parity]
    paths:
      - '.github/workflows/tdd-v10.0.10-red.yml'
      - 'build_input/test_v1010_custom_map_parity.py'

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare untouched V10.0.9 base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base | Out-Null
          gh release download v10.0.9 --repo $env:GITHUB_REPOSITORY -p NghiaClient_V10.0.9_MiuMiuTimer_CaptchaClientCapture_Windows.zip -D base
          $zip='base/NghiaClient_V10.0.9_MiuMiuTimer_CaptchaClientCapture_Windows.zip'
          $got=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne '6cffcaa02f416768986348dd418faad3ea89a7fba38f56cb000192cdee725751') { throw "V10.0.9 base hash mismatch $got" }
          Expand-Archive $zip -DestinationPath portable -Force
      - name: Install pytest
        run: python -m pip install pytest
      - name: Confirm tests are RED on V10.0.9
        shell: pwsh
        env:
          NGHIA_APP_DIR: portable/app_payload
        run: |
          python -m pytest -q build_input/test_v1010_custom_map_parity.py
