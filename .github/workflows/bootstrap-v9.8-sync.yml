name: Bootstrap V9.8 implementation sync

on:
  push:
    branches:
      - release-v9.8.0-exact-detector-watchdog-recovery
    paths:
      - sync/v9.8-bootstrap-ready.txt

permissions:
  contents: write

jobs:
  apply-series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V9.8 branch
        uses: actions/checkout@v4
        with:
          ref: release-v9.8.0-exact-detector-watchdog-recovery
          fetch-depth: 0

      - name: Reassemble and apply TDD commit series
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v9.8-bootstrap.patch.gz
          echo "PARTS=$(find sync -maxdepth 1 -type f -name 'v9.8-bootstrap-part*.b64' | sort | tr '\n' ' ')"
          for part in $(find sync -maxdepth 1 -type f -name 'v9.8-bootstrap-part*.b64' | sort); do
            echo "DECODING=$part SIZE=$(wc -c < \"$part\")"
            base64 -d "$part" >> /tmp/v9.8-bootstrap.patch.gz
          done
          gz_sha=$(sha256sum /tmp/v9.8-bootstrap.patch.gz | awk '{print $1}')
          echo "GZ_SHA=$gz_sha"
          test "$gz_sha" = "26546941142400e6345c26146d0abb0f6adf31473324ca2b20f122baa545b1ab"
          gzip -dc /tmp/v9.8-bootstrap.patch.gz > /tmp/v9.8-bootstrap.patch
          patch_sha=$(sha256sum /tmp/v9.8-bootstrap.patch | awk '{print $1}')
          echo "PATCH_SHA=$patch_sha"
          echo "PATCH_SUBJECTS=$(grep -c '^Subject: \[PATCH ' /tmp/v9.8-bootstrap.patch)"
          test "$patch_sha" = "a764579fb8c5588a59bd099b333d5aa085b019cb5295a6091fe042fba220604b"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          if ! git am --3way /tmp/v9.8-bootstrap.patch; then
            echo 'GIT_AM_FAILED'
            git status --short || true
            git am --show-current-patch=diff || true
            git am --abort || true
            exit 1
          fi
          echo 'GIT_AM_OK'
          git log --oneline -15

      - name: Remove temporary bootstrap files and push
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/bootstrap-v9.8-sync.yml sync/v9.8-bootstrap-ready.txt
          git rm -f sync/v9.8-bootstrap-part*.b64
          git commit -m 'chore: remove v9.8 bootstrap sync'
          git push origin HEAD:release-v9.8.0-exact-detector-watchdog-recovery
