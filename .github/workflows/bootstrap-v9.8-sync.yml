name: Bootstrap V9.8 implementation sync

on:
  push:
    branches:
      - release-v9.8.0-exact-detector-watchdog-recovery
    paths:
      - sync/v9.8-bootstrap-ready.txt

permissions:
  contents: write

jobs:
  apply-series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V9.8 branch
        uses: actions/checkout@v4
        with:
          ref: release-v9.8.0-exact-detector-watchdog-recovery
          fetch-depth: 0

      - name: Reassemble and apply TDD commit series
        shell: bash
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD)
          parts=(
            sync/v9.8-bootstrap-part01.b64
            sync/v9.8-bootstrap-part02a.b64
            sync/v9.8-bootstrap-part02b.b64
            sync/v9.8-bootstrap-part02c.b64
            sync/v9.8-bootstrap-part03.b64
            sync/v9.8-bootstrap-part04a.b64
            sync/v9.8-bootstrap-part04b.b64
            sync/v9.8-bootstrap-part04c.b64
            sync/v9.8-bootstrap-part05.b64
          )
          : > /tmp/v9.8-bootstrap.patch.gz
          for part in "${parts[@]}"; do
            base64 -d "$part" >> /tmp/v9.8-bootstrap.patch.gz
          done
          gz_sha=$(sha256sum /tmp/v9.8-bootstrap.patch.gz | awk '{print $1}')
          echo "GZ_SHA=$gz_sha"
          test "$gz_sha" = "26546941142400e6345c26146d0abb0f6adf31473324ca2b20f122baa545b1ab"
          gzip -dc /tmp/v9.8-bootstrap.patch.gz > /tmp/v9.8-bootstrap.patch
          patch_sha=$(sha256sum /tmp/v9.8-bootstrap.patch | awk '{print $1}')
          echo "PATCH_SHA=$patch_sha"
          test "$patch_sha" = "a764579fb8c5588a59bd099b333d5aa085b019cb5295a6091fe042fba220604b"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git am --3way /tmp/v9.8-bootstrap.patch
          echo 'GIT_AM_OK'
          git reset --soft "$base"
          git restore --staged .github/workflows/publish-v9.8.0.yml || true
          rm -f .github/workflows/publish-v9.8.0.yml
          git rm -f sync/v9.8-bootstrap-ready.txt
          git rm -f sync/v9.8-bootstrap-part*.b64
          git commit -m 'feat: sync v9.8 exact detector watchdog implementation'
          git push origin HEAD:release-v9.8.0-exact-detector-watchdog-recovery
          echo 'V980_IMPLEMENTATION_SYNC_OK'
