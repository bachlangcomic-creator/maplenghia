name: Bootstrap V9.8 implementation sync

on:
  push:
    branches:
      - release-v9.8.0-exact-detector-watchdog-recovery
    paths:
      - sync/v9.8-bootstrap-ready.txt

permissions:
  contents: write

jobs:
  apply-series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V9.8 branch
        uses: actions/checkout@v4
        with:
          ref: release-v9.8.0-exact-detector-watchdog-recovery
          fetch-depth: 0

      - name: Reassemble and apply TDD commit series
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/v9.8-bootstrap.patch
          for part in $(find sync -maxdepth 1 -type f -name 'v9.8-bootstrap-part*.b64' | sort); do
            base64 -d "$part" >> /tmp/v9.8-bootstrap.patch
          done
          test "$(sha256sum /tmp/v9.8-bootstrap.patch | awk '{print $1}')" = "fa4a7243fcf5b745c99653f0f5167f726f68f8a3935ed9c20cb3fba2001a4611"
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git am --3way /tmp/v9.8-bootstrap.patch

      - name: Remove temporary bootstrap files and push
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/bootstrap-v9.8-sync.yml sync/v9.8-bootstrap-ready.txt
          git rm -f sync/v9.8-bootstrap-part*.b64
          git commit -m 'chore: remove v9.8 bootstrap sync'
          git push origin HEAD:release-v9.8.0-exact-detector-watchdog-recovery
