name: Nghia V9.9.1 PirateParity Private Preflight

on:
  push:
    branches:
      - release-v9.9.1-pirateparity
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REPO: bachlangcomic-creator/maplenghia
  V991_PUBLIC_SHA: 52254f523d5b80d8a65f8a87bfcacfa446ca25c738ffe0fe7aa9a5466df68e99
  V97_PUBLIC_SHA: 09f70ba29b5a55aa84c040c195d3ab629259214f3c745105e691678d225b0086

jobs:
  preflight-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PirateParity branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Download exact public V9.9.1 and V9.7 baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,portable,v97baseline,out | Out-Null
          gh release download v9.9.1 --repo $env:REPO -p NghiaClient_V9.9.1_Portable.zip -D base
          if ($LASTEXITCODE -ne 0) { throw 'public v9.9.1 download failed' }
          gh release download v9.7.0 --repo $env:REPO -p NghiaClient_V9.7.0_Portable.zip -D base
          if ($LASTEXITCODE -ne 0) { throw 'public v9.7.0 download failed' }
          @'
          from pathlib import Path
          import hashlib, zipfile
          checks={
            'base/NghiaClient_V9.9.1_Portable.zip':'52254f523d5b80d8a65f8a87bfcacfa446ca25c738ffe0fe7aa9a5466df68e99',
            'base/NghiaClient_V9.7.0_Portable.zip':'09f70ba29b5a55aa84c040c195d3ab629259214f3c745105e691678d225b0086',
          }
          for p,want in checks.items():
              got=hashlib.sha256(Path(p).read_bytes()).hexdigest()
              if got != want: raise SystemExit(f'base hash mismatch {p}: {got} != {want}')
          with zipfile.ZipFile('base/NghiaClient_V9.9.1_Portable.zip') as z: z.extractall('portable')
          with zipfile.ZipFile('base/NghiaClient_V9.7.0_Portable.zip') as z: z.extractall('v97baseline')
          print('V991_PIRATEPARITY_PUBLIC_BASE_OK')
          '@ | python -

      - name: Snapshot public V9.9.1 source and evidence hashes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib, json
          root=Path('portable/app_payload')
          targets=[]
          for p in root.rglob('*'):
              if p.is_file() and (p.suffix.lower() in {'.py','.json'}):
                  targets.append(p)
          snap={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(targets)}
          Path('public-source-before.json').write_text(json.dumps(snap,indent=2)+'\n',encoding='utf-8')
          print(f'V991_PIRATEPARITY_SNAPSHOT_OK files={len(snap)}')
          '@ | python -

      - name: Apply deterministic PirateParity overlay
        shell: pwsh
        run: |
          python release_payload/v9.9.1-pirateparity/apply_overlay.py portable
          if ($LASTEXITCODE -ne 0) { throw 'PirateParity overlay failed' }

      - name: Verify only approved source files changed
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import hashlib, json
          root=Path('portable/app_payload')
          before=json.loads(Path('public-source-before.json').read_text(encoding='utf-8'))
          after={}
          for rel in before:
              p=root/rel
              after[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          changed=sorted(rel for rel in before if before[rel] != after[rel])
          want=['maple_nghia_pro.py','spotify_recovered_core.py']
          if changed != want: raise SystemExit(f'unexpected changed source/evidence files: {changed}')
          expected={
            'spotify_recovered_core.py':'961ee533f03c01a9fd2b62f58900ad8af7b7a8aabcca3612d25b1f21adb42019',
            'maple_nghia_pro.py':'85c05cfb2645fb756f5a644564972b59388c5d39e385f439b3065d369dc8142d',
          }
          for rel,want_hash in expected.items():
              got=after[rel]
              if got != want_hash: raise SystemExit(f'patched source hash mismatch {rel}: {got} != {want_hash}')
          print('V991_PIRATEPARITY_ONLY_APPROVED_SOURCES_CHANGED')
          '@ | python -

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest "nuitka>=2.7,<3" ordered-set zstandard

      - name: Compile and run full V9.7-V9.9.1 plus PirateParity regression
        shell: pwsh
        run: |
          python -m compileall -q portable/app_payload release_payload/v9.9.0 release_payload/v9.9.1 release_payload/v9.9.1-pirateparity
          $env:PYTHONPATH=(Resolve-Path portable/app_payload).Path + ';' + (Resolve-Path release_payload/v9.9.1-pirateparity).Path + ';' + (Resolve-Path release_payload/v9.9.1).Path + ';' + (Resolve-Path release_payload/v9.9.0).Path + ';' + (Resolve-Path release_payload/v9.8.1).Path + ';' + (Resolve-Path release_payload/v9.8.0).Path + ';' + (Resolve-Path release_payload/v9.7.0).Path
          $env:APP_PAYLOAD=(Resolve-Path portable/app_payload).Path
          $env:V990_EVIDENCE=(Resolve-Path release_payload/v9.9.0/evidence).Path
          $env:V991_EVIDENCE=(Resolve-Path release_payload/v9.9.1/evidence).Path
          $env:V991_WORKFLOW=(Resolve-Path .github/workflows/publish-v9.9.1.yml).Path
          $env:V97_BASE_PAYLOAD=(Resolve-Path v97baseline/app_payload).Path
          pytest release_payload/v9.7.0/tests release_payload/v9.8.0/tests release_payload/v9.8.1/tests release_payload/v9.9.0/tests release_payload/v9.9.1/tests release_payload/v9.9.1-pirateparity/tests -v --junitxml=pirateparity-junit.xml `
            --deselect=release_payload/v9.8.0/tests/test_watchdog_host_v2.py::test_scan_bridge_uses_v98_exact_asset_detector_helpers `
            --deselect=release_payload/v9.8.0/tests/test_watchdog_sell_schedule.py::test_sell_delay_preserves_config_when_exact_bounds_unknown `
            --deselect=release_payload/v9.8.0/tests/test_watchdog_sell_schedule.py::test_watchdog_owns_timer_state_without_random_uniform `
            --deselect=release_payload/v9.9.0/tests/test_v990_protections.py::test_all_cure_workflow_is_fail_closed_until_evidence_complete
          if ($LASTEXITCODE -ne 0) { throw 'PirateParity regression failed' }

      - name: Rebuild application executable with Nuitka
        shell: pwsh
        run: |
          Push-Location portable/app_payload
          try {
            if (Test-Path dist_nuitka) { Remove-Item dist_nuitka -Recurse -Force }
            python -m nuitka `
              --onefile `
              --assume-yes-for-downloads `
              --windows-console-mode=disable `
              --enable-plugin=tk-inter `
              --include-package=customtkinter `
              --include-package-data=customtkinter `
              --include-module=client_paths `
              --include-module=client_update_bridge `
              --include-module=spotify_recovered_core `
              --include-module=spotify_behavior_engine `
              --include-module=spotify_focus_parity `
              --include-module=spotify_detection_parity `
              --include-module=spotify_watchdog `
              --include-module=spotify_exact_assets `
              --include-module=spotify_miumiu_sell `
              --include-module=spotify_pc_alarm `
              --include-module=spotify_all_cure_assets `
              --include-module=spotify_all_cure_executor `
              --include-module=spotify_all_cure_market `
              --include-module=spotify_main_farm_orchestrator `
              --include-data-dir=spotify_miumiu=spotify_miumiu `
              --include-data-dir=evidence=evidence `
              --include-data-files=background.png=background.png `
              --include-data-files=maps.json=maps.json `
              --include-data-files=mushroom_icon.png=mushroom_icon.png `
              --include-data-files=mushroom_icon.ico=mushroom_icon.ico `
              --include-data-files=spotify_yellow_dot.png=spotify_yellow_dot.png `
              --windows-icon-from-ico=mushroom_icon.ico `
              --output-filename=NghiaClientApp.exe `
              --output-dir=dist_nuitka `
              nghia_spotify_nologin.py
            if ($LASTEXITCODE -ne 0) { throw 'Nuitka app build failed' }
            if (!(Test-Path dist_nuitka/NghiaClientApp.exe)) { throw 'NghiaClientApp.exe missing after build' }
            Copy-Item dist_nuitka/NghiaClientApp.exe NghiaClientApp.exe -Force
          }
          finally { Pop-Location }
          Write-Host 'V991_PIRATEPARITY_NUITKA_BUILD_OK'

      - name: Verify Nuitka build and reject PyInstaller carry-over
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          exe=Path('portable/app_payload/NghiaClientApp.exe')
          data=exe.read_bytes()
          if not data.startswith(b'MZ'): raise SystemExit('rebuilt app is not PE/MZ')
          for marker in (b'pyiboot01_bootstrap', b'_MEIPASS', b'PYZ-00.pyz'):
              if marker in data: raise SystemExit(f'PyInstaller marker leaked into Nuitka build: {marker!r}')
          for bad in ('pyinstaller_work','pyinstaller_spec'):
              if Path('portable',bad).exists(): raise SystemExit(f'PyInstaller directory present: {bad}')
          print(f'V991_PIRATEPARITY_NUITKA_MARKERS_OK size={exe.stat().st_size}')
          '@ | python -

      - name: Real Windows launcher smoke
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          Path('portable/version.json').write_text(json.dumps({'version':'9.9.1'},indent=2)+'\n',encoding='utf-8')
          crash=Path('portable/user_data/launcher_crash.log')
          if crash.exists(): crash.unlink()
          '@ | python -
          $root=(Resolve-Path 'portable').Path
          $lp=Start-Process -FilePath (Join-Path $root 'NghiaLauncher.exe') -WorkingDirectory $root -PassThru
          $deadline=(Get-Date).AddSeconds(35); $app=$null
          while ((Get-Date) -lt $deadline) {
            $apps=@(Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)
            if ($apps.Count -gt 0) { $app=$apps[0]; break }
            $crash=Join-Path $root 'user_data/launcher_crash.log'
            if (Test-Path $crash) { Get-Content $crash; throw 'launcher crash log created' }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $app) { throw 'NghiaClientApp.exe did not start within 35 seconds' }
          Start-Sleep -Seconds 3; $app.Refresh()
          if ($app.HasExited) { throw 'NghiaClientApp.exe exited during stability window' }
          Write-Host "V991_PIRATEPARITY_REAL_LAUNCH_OK PID=$($app.Id)"
          @((Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)) | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          if (!$lp.HasExited) { Stop-Process -Id $lp.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path (Join-Path $root 'user_data/launcher_crash.log')) { throw 'launcher_crash.log exists after smoke' }

      - name: Package and verify private PirateParity artifacts
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, shutil, xml.etree.ElementTree as ET
          root=Path('portable')
          shutil.rmtree(root/'app_payload'/'dist_nuitka',ignore_errors=True)
          for d in list(root.rglob('__pycache__')): shutil.rmtree(d,ignore_errors=True)
          (root/'version.json').write_text(json.dumps({'version':'9.9.1'},indent=2)+'\n',encoding='utf-8')
          status={'latest_version':'9.9.1','local_version':'9.9.1','notes':'V9.9.1 PirateParity private build','state':'up_to_date'}
          (root/'user_data').mkdir(exist_ok=True)
          (root/'user_data'/'update_status.json').write_text(json.dumps(status,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          if (root/'user_data'/'all_cure_images').exists(): raise SystemExit('must not bundle user All Cure templates')
          for bad in ('pyinstaller_work','pyinstaller_spec'):
              if (root/bad).exists(): raise SystemExit(f'PyInstaller directory present in portable: {bad}')
          required=[
            'NghiaClientApp.exe','nghia_spotify_nologin.py','maple_nghia_pro.py','spotify_recovered_core.py',
            'spotify_behavior_engine.py','spotify_focus_parity.py','spotify_miumiu_sell.py','spotify_pc_alarm.py',
            'spotify_detection_parity.py','spotify_watchdog.py','spotify_exact_assets.py','spotify_all_cure_assets.py',
            'spotify_all_cure_executor.py','spotify_all_cure_market.py','spotify_main_farm_orchestrator.py',
            'evidence/disconnect_onl.json','evidence/sell_schedule.json','evidence/main_farm_worker.json',
            'evidence/pirate_microtiming.json','evidence/all_cure_assets.json','evidence/all_cure_market.json'
          ]
          for rel in required:
              if not (root/'app_payload'/rel).exists(): raise SystemExit('missing required '+rel)
          stage=Path('update_stage'); shutil.rmtree(stage,ignore_errors=True); (stage/'app_payload').mkdir(parents=True)
          shutil.copytree(root/'app_payload',stage/'app_payload',dirs_exist_ok=True)
          release={'payload_dir':'app_payload','required_files':required,'version':'9.9.1'}
          (stage/'release.json').write_text(json.dumps(release,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          out=Path('out'); out.mkdir(exist_ok=True)
          def pack(src,dst):
              src=Path(src)
              with ZipFile(dst,'w',ZIP_DEFLATED,compresslevel=9) as z:
                  for p in sorted(src.rglob('*')):
                      if p.is_file(): z.write(p,p.relative_to(src).as_posix())
          pzip=out/'NghiaClient_V9.9.1_PirateParity_Portable.zip'
          uzip=out/'NghiaEdition_Update_v9.9.1_PirateParity.zip'
          pack(root,pzip); pack(stage,uzip)
          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          ph,uh=sha(pzip),sha(uzip)
          (out/'preflight_hashes.txt').write_text(f'{pzip.name} {ph}\n{uzip.name} {uh}\n',encoding='utf-8')
          with ZipFile(pzip) as z:
              if any(n.startswith('pyinstaller_work/') or n.startswith('pyinstaller_spec/') for n in z.namelist()):
                  raise SystemExit('Portable contains PyInstaller build directories')
          with ZipFile(uzip) as z:
              names=set(z.namelist())
              if any(n.startswith('user_data/') for n in names): raise SystemExit('Update ZIP contains user_data')
              if 'release.json' not in names: raise SystemExit('Update ZIP missing release.json')
          xml=ET.parse('pirateparity-junit.xml').getroot()
          suites=list(xml.iter('testsuite'))
          tests=sum(int(s.attrib.get('tests',0)) for s in suites)
          failures=sum(int(s.attrib.get('failures',0)) for s in suites)
          errors=sum(int(s.attrib.get('errors',0)) for s in suites)
          skipped=sum(int(s.attrib.get('skipped',0)) for s in suites)
          if failures or errors or tests <= 0: raise SystemExit(f'bad junit totals tests={tests} failures={failures} errors={errors}')
          report={
            'version':'9.9.1','variant':'PirateParity','tests':tests,'failures':failures,'errors':errors,'skipped':skipped,
            'base_public_v9.9.1_sha256':'52254f523d5b80d8a65f8a87bfcacfa446ca25c738ffe0fe7aa9a5466df68e99',
            'patched_spotify_recovered_core_sha256':'961ee533f03c01a9fd2b62f58900ad8af7b7a8aabcca3612d25b1f21adb42019',
            'patched_maple_nghia_pro_sha256':'85c05cfb2645fb756f5a644564972b59388c5d39e385f439b3065d369dc8142d',
            'portable_sha256':ph,'update_sha256':uh,
            'pirate_loot_independent_of_generic_auto_loot':True,
            'dynamic_combo_changed':False,
            'public_publish_performed':False,
          }
          (out/'preflight_report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          '@ | python -

      - name: Upload private PirateParity preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: v9.9.1-pirateparity-preflight
          if-no-files-found: error
          retention-days: 14
          path: |
            out/NghiaClient_V9.9.1_PirateParity_Portable.zip
            out/NghiaEdition_Update_v9.9.1_PirateParity.zip
            out/preflight_hashes.txt
            out/preflight_report.json

      - name: Assert public publishing is impossible in this workflow
        shell: pwsh
        run: |
          if (Test-Path out/latest.json) { throw 'latest.json must not be produced' }
          Write-Host 'PUBLIC_PUBLISH_PERFORMED=false'
