name: V9.7.0 dispatch resolver

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Resolve V9.7 branch workflow only'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  wrong-ref-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run default-branch stub
        run: |
          echo 'ERROR: default-branch V9.7 resolver stub executed instead of release branch workflow.'
          exit 99
