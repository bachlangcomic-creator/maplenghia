name: Build Nghia V9.4 Portable EXEs

on:
  workflow_dispatch:
  push:
    branches:
      - build-v9.4.0
    paths:
      - "ci/**"
      - ".github/workflows/build-v9.4.0.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka ordered-set zstandard
          python -m pip install "requests>=2.32,<3" "opencv-python>=4.8" "Pillow>=10.0" "numpy>=1.24" "mss>=9.0" "pydirectinput>=1.0.4" "customtkinter>=5.2.2" "pyautogui>=0.9.54"

      - name: Build NghiaClientApp.exe bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m nuitka `
            --onefile `
            --standalone `
            --assume-yes-for-downloads `
            --enable-plugin=tk-inter `
            --windows-console-mode=disable `
            --include-package=customtkinter `
            --include-package-data=customtkinter `
            --include-package=cv2 `
            --include-package=mss `
            --include-package=PIL `
            --include-package=numpy `
            --include-package=pydirectinput `
            --include-package=pyautogui `
            --output-filename=NghiaClientApp.exe `
            --output-dir=dist `
            --remove-output `
            ci/client_bootstrap.py
          if (!(Test-Path "dist/NghiaClientApp.exe")) { throw "NghiaClientApp.exe was not produced" }

      - name: Build NghiaLauncher.exe bootstrap
        shell: pwsh
        run: |
          python -m nuitka `
            --onefile `
            --standalone `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --include-package=requests `
            --output-filename=NghiaLauncher.exe `
            --output-dir=dist `
            --remove-output `
            ci/launcher_bootstrap.py
          if (!(Test-Path "dist/NghiaLauncher.exe")) { throw "NghiaLauncher.exe was not produced" }

      - name: Smoke inspect outputs
        shell: pwsh
        run: |
          Get-Item dist/NghiaLauncher.exe, dist/NghiaClientApp.exe | Format-Table Name,Length
          $app = [IO.File]::ReadAllBytes("dist/NghiaClientApp.exe")
          $launcher = [IO.File]::ReadAllBytes("dist/NghiaLauncher.exe")
          if ($app[0] -ne 0x4D -or $app[1] -ne 0x5A) { throw "App EXE missing MZ header" }
          if ($launcher[0] -ne 0x4D -or $launcher[1] -ne 0x5A) { throw "Launcher EXE missing MZ header" }

      - name: Smoke execute app bootstrap
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "smoke-app"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "dist/NghiaClientApp.exe" (Join-Path $dir "NghiaClientApp.exe")
          Set-Content -LiteralPath (Join-Path $dir "nghia_spotify_nologin.py") -Encoding UTF8 -Value "from pathlib import Path; Path(__file__).with_name('app.marker').write_text('ok', encoding='utf-8')"
          & (Join-Path $dir "NghiaClientApp.exe")
          if (!(Test-Path (Join-Path $dir "app.marker"))) { throw "App bootstrap did not execute adjacent source" }

      - name: Smoke execute launcher bootstrap
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "smoke-launcher"
          New-Item -ItemType Directory -Force (Join-Path $dir "launcher") | Out-Null
          Copy-Item "dist/NghiaLauncher.exe" (Join-Path $dir "NghiaLauncher.exe")
          Set-Content -LiteralPath (Join-Path $dir "launcher/nghia_launcher.py") -Encoding UTF8 -Value "from pathlib import Path; Path(__file__).parent.parent.joinpath('launcher.marker').write_text('ok', encoding='utf-8')"
          & (Join-Path $dir "NghiaLauncher.exe")
          if (!(Test-Path (Join-Path $dir "launcher.marker"))) { throw "Launcher bootstrap did not execute adjacent source" }

      - name: Upload portable executables
        uses: actions/upload-artifact@v4
        with:
          name: Nghia-V9.4-Portable-EXEs
          path: |
            dist/NghiaLauncher.exe
            dist/NghiaClientApp.exe
          if-no-files-found: error
          retention-days: 7
