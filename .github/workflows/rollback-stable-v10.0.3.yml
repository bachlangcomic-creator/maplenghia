name: Rollback stable to V10.0.3 Loot Parity Defense

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-stable-v10.0.3.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify stable manifest is V10.0.3 Loot Parity Defense
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('latest.json',encoding='utf-8'))
          assert p['version']=='10.0.3', p
          assert p['channel']=='stable', p
          assert p['package_url'].endswith('/v10.0.3/NghiaEdition_Update_v10.0.3.zip'), p
          assert p['sha256']=='9167b43a15127bd351dc94bbe300ef31e18dd5d5b2152f8de4897435b021acb3', p
          print('STABLE_V1003_MANIFEST_OK')
          PY

      - name: Hide unfinished V10.0.4 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v10.0.4 --repo bachlangcomic-creator/maplenghia --draft=true

      - name: Verify V10.0.4 is draft and V10.0.3 is public
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          draft=$(gh release view v10.0.4 --repo bachlangcomic-creator/maplenghia --json isDraft --jq .isDraft)
          test "$draft" = "true"
          name=$(gh release view v10.0.3 --repo bachlangcomic-creator/maplenghia --json name --jq .name)
          test "$name" = "Nghia Client v10.0.3 - Loot Parity Defense"
          echo "ROLLBACK_RELEASE_STATE_OK"
