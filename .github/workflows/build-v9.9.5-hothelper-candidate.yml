name: Build Nghia V9.9.5 HotHelper Candidate

on:
  pull_request:
    branches:
      - release-v9.9.4-c2focus
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: bachlangcomic-creator/maplenghia
  SOURCE_TAG: v9.9.4-source-input
  SOURCE_ASSET: Nghia_V9.9.4_C2FocusWorkerParity_FullSourceCandidate.zip
  SOURCE_SHA256: 77b0a3cfe379b0efe2d980b117b41171d437c6177fdfc05cd8c494c7d809542b
  CORE_PATCH_SHA256: 4c315ce041835d5c6837608d4f52bca2e7b3a876a731a8df8a00f0bbe06b4ac4
  TESTMETA_PATCH_SHA256: 4d7dee21b6b45f82f8a016f395468f3c386095d00a206242b1adfe37f840d3d3
  OUTLIER_PATCH_SHA256: 27fcd754ee2d9c57ff1a1da3f032ddc91e473efc331a4363e3baf429febd593b
  HOTHELPER_PATCH_SHA256: 7d61e6fc28e3de2b45d99f2c890eb865ac2d5952023c0af85a785286983f69bc
  BASE_PORTABLE_SHA256: 7359f223339bf857fcbe68c7df036d6857cfe7b81a49ce76d5a217001f8a10b4

jobs:
  windows-hothelper-candidate:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force deterministic LF checkout
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Reconstruct exact HotHelper-corrected V9.9.5 source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force source_in,source_extract,candidate,base,portable,out,verify | Out-Null
          gh release download $env:SOURCE_TAG --repo $env:REPO -p $env:SOURCE_ASSET -D source_in
          if ($LASTEXITCODE -ne 0) { throw 'V9.9.4 source asset download failed' }
          $asset = Join-Path source_in $env:SOURCE_ASSET
          $got=(Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $env:SOURCE_SHA256) { throw "source hash mismatch $got" }

          $core='release_payload/v9.9.5/v995_core.patch'
          $testmeta='release_payload/v9.9.5/v995_tests_metadata.patch'
          $outlier='release_payload/v9.9.5/v995_outlier_scope.patch'
          $hot='release_payload/v9.9.5/v995_hothelper_parity.patch'
          $checks=@(
            @($core,$env:CORE_PATCH_SHA256,'core'),
            @($testmeta,$env:TESTMETA_PATCH_SHA256,'tests/metadata'),
            @($outlier,$env:OUTLIER_PATCH_SHA256,'outlier'),
            @($hot,$env:HOTHELPER_PATCH_SHA256,'hothelper')
          )
          foreach ($c in $checks) {
            $h=(Get-FileHash $c[0] -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -ne $c[1]) { throw "$($c[2]) patch hash mismatch $h" }
          }

          Expand-Archive $asset -DestinationPath source_extract -Force
          $roots=@(Get-ChildItem source_extract -Directory)
          if ($roots.Count -ne 1) { throw "expected one source root, got $($roots.Count)" }
          Copy-Item (Join-Path $roots[0].FullName '*') candidate -Recurse -Force

          git apply --check --directory=candidate $core
          if ($LASTEXITCODE -ne 0) { throw 'core patch check failed' }
          git apply --directory=candidate $core
          if ($LASTEXITCODE -ne 0) { throw 'core patch apply failed' }
          git apply --check --directory=candidate $testmeta
          if ($LASTEXITCODE -ne 0) { throw 'tests/metadata patch check failed' }
          git apply --directory=candidate $testmeta
          if ($LASTEXITCODE -ne 0) { throw 'tests/metadata patch apply failed' }
          git apply --check -p1 --directory=candidate --exclude='*/BUILD_STATUS.md' --exclude='*/review_report.md' $outlier
          if ($LASTEXITCODE -ne 0) { throw 'outlier patch check failed' }
          git apply -p1 --directory=candidate --exclude='*/BUILD_STATUS.md' --exclude='*/review_report.md' $outlier
          if ($LASTEXITCODE -ne 0) { throw 'outlier patch apply failed' }
          git apply --check -p1 --directory=candidate --exclude='*/BUILD_STATUS.md' --exclude='*/review_report.md' $hot
          if ($LASTEXITCODE -ne 0) { throw 'hothelper patch check failed' }
          git apply -p1 --directory=candidate --exclude='*/BUILD_STATUS.md' --exclude='*/review_report.md' $hot
          if ($LASTEXITCODE -ne 0) { throw 'hothelper patch apply failed' }

          @'
          from pathlib import Path
          import hashlib, json
          root=Path('candidate')
          report=json.loads((root/'source_preflight_report.json').read_text(encoding='utf-8'))
          assert report['version']=='9.9.5', report
          assert report['variant']=='AllMapWorkerParityHotHelperCorrection', report
          assert report['local_v995_tests']=={'count':43,'failures':0,'errors':0,'passed':True}, report
          assert report['compileall'] is True
          assert report['public_publish_performed'] is False
          hashes=json.loads((root/'VERIFIED_HASHES.json').read_text(encoding='utf-8'))
          for rel,want in hashes.items():
              p=root/'app_payload'/rel
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if got != want: raise SystemExit(f'hash mismatch {rel}: {got} != {want}')
          assert hashes['spotify_recovered_core.py']=='18e164944d5842629af55ca0f70f274192421515c01ac6451c0bdedf13109d95'
          assert hashes['maple_nghia_pro.py']=='8ee70b2b457dd21010f3adbeb30dbb7052245d846304295fddd59290c8f9ba48'
          print('V995_HOTHELPER_SOURCE_RECONSTRUCTED_AND_VERIFIED')
          '@ | python -

      - name: Prepare verified launcher baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v9.9.2 --repo $env:REPO -p NghiaClient_V9.9.2_Portable.zip -D base
          if ($LASTEXITCODE -ne 0) { throw 'V9.9.2 portable download failed' }
          $baseZip='base/NghiaClient_V9.9.2_Portable.zip'
          $got=(Get-FileHash $baseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $env:BASE_PORTABLE_SHA256) { throw "baseline portable hash mismatch $got" }
          Expand-Archive $baseZip -DestinationPath portable -Force
          Remove-Item portable/app_payload -Recurse -Force
          Copy-Item candidate/app_payload portable/app_payload -Recurse -Force
          @'
          from pathlib import Path
          import json
          Path('portable/version.json').write_text(json.dumps({'version':'9.9.5'},indent=2)+'\n',encoding='utf-8')
          print('V995_PORTABLE_BASE_PREPARED')
          '@ | python -

      - name: Install test and Nuitka dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest "nuitka>=2.7,<3" ordered-set zstandard

      - name: Compile and test corrected source
        shell: pwsh
        run: |
          python -m compileall -q candidate/app_payload candidate/tests
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          $env:APP_PAYLOAD=(Resolve-Path candidate/app_payload).Path
          $env:PYTHONPATH=(Resolve-Path candidate/app_payload).Path
          pytest candidate/tests -v --junitxml=v995-junit.xml
          if ($LASTEXITCODE -ne 0) { throw 'V9.9.5 tests failed' }
          Write-Host 'V995_HOTHELPER_TESTS_AND_COMPILE_OK'

      - name: Rebuild NghiaClientApp.exe with Nuitka
        shell: pwsh
        run: |
          Push-Location portable/app_payload
          try {
            if (Test-Path dist_nuitka) { Remove-Item dist_nuitka -Recurse -Force }
            python -m nuitka `
              --onefile `
              --assume-yes-for-downloads `
              --windows-console-mode=disable `
              --enable-plugin=tk-inter `
              --include-package=customtkinter `
              --include-package-data=customtkinter `
              --include-module=client_paths `
              --include-module=client_update_bridge `
              --include-module=spotify_recovered_core `
              --include-module=spotify_recovered_api `
              --include-module=spotify_behavior_engine `
              --include-module=spotify_focus_parity `
              --include-module=spotify_detection_parity `
              --include-module=spotify_watchdog `
              --include-module=spotify_exact_assets `
              --include-module=spotify_miumiu_sell `
              --include-module=spotify_pc_alarm `
              --include-module=spotify_all_cure_assets `
              --include-module=spotify_all_cure_executor `
              --include-module=spotify_all_cure_market `
              --include-module=spotify_main_farm_orchestrator `
              --include-module=spotify_c2_runtime_support `
              --include-data-dir=spotify_miumiu=spotify_miumiu `
              --include-data-dir=evidence=evidence `
              --include-data-files=background.png=background.png `
              --include-data-files=maps.json=maps.json `
              --include-data-files=mushroom_icon.png=mushroom_icon.png `
              --include-data-files=mushroom_icon.ico=mushroom_icon.ico `
              --include-data-files=spotify_yellow_dot.png=spotify_yellow_dot.png `
              --windows-icon-from-ico=mushroom_icon.ico `
              --output-filename=NghiaClientApp.exe `
              --output-dir=dist_nuitka `
              nghia_spotify_nologin.py
            if ($LASTEXITCODE -ne 0) { throw 'Nuitka build failed' }
            if (!(Test-Path dist_nuitka/NghiaClientApp.exe)) { throw 'NghiaClientApp.exe missing' }
            Copy-Item dist_nuitka/NghiaClientApp.exe NghiaClientApp.exe -Force
          }
          finally { Pop-Location }
          @'
          from pathlib import Path
          exe=Path('portable/app_payload/NghiaClientApp.exe')
          data=exe.read_bytes()
          if not data.startswith(b'MZ'): raise SystemExit('not a PE/MZ executable')
          for marker in (b'pyiboot01_bootstrap',b'_MEIPASS',b'PYZ-00.pyz'):
              if marker in data: raise SystemExit(f'PyInstaller marker present: {marker!r}')
          print('V995_HOTHELPER_NUITKA_PE_OK', exe.stat().st_size)
          '@ | python -

      - name: Real Windows launcher smoke
        shell: pwsh
        run: |
          $root=(Resolve-Path 'portable').Path
          $ud=Join-Path $root 'user_data'
          New-Item -ItemType Directory -Force $ud | Out-Null
          $crash=Join-Path $ud 'launcher_crash.log'
          if (Test-Path $crash) { Remove-Item $crash -Force }
          if (!(Test-Path (Join-Path $root 'NghiaLauncher.exe'))) { throw 'NghiaLauncher.exe missing' }
          $lp=Start-Process -FilePath (Join-Path $root 'NghiaLauncher.exe') -WorkingDirectory $root -PassThru
          $deadline=(Get-Date).AddSeconds(35); $app=$null
          while ((Get-Date) -lt $deadline) {
            $apps=@(Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)
            if ($apps.Count -gt 0) { $app=$apps[0]; break }
            if (Test-Path $crash) { Get-Content $crash; throw 'launcher crash log created' }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $app) { throw 'NghiaClientApp.exe did not start within 35 seconds' }
          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) { throw 'NghiaClientApp.exe exited during stability window' }
          Write-Host "V995_HOTHELPER_WINDOWS_LAUNCH_OK PID=$($app.Id)"
          @((Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)) | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          if (!$lp.HasExited) { Stop-Process -Id $lp.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $crash) { throw 'launcher_crash.log exists after smoke' }

      - name: Package candidate artifact
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, shutil, xml.etree.ElementTree as ET
          root=Path('portable')
          shutil.rmtree(root/'app_payload'/'dist_nuitka',ignore_errors=True)
          for d in list(root.rglob('__pycache__')): shutil.rmtree(d,ignore_errors=True)
          for d in list(root.rglob('.pytest_cache')): shutil.rmtree(d,ignore_errors=True)
          ud=root/'user_data'; ud.mkdir(exist_ok=True)
          crash=ud/'launcher_crash.log'
          if crash.exists(): crash.unlink()
          (root/'version.json').write_text(json.dumps({'version':'9.9.5'},indent=2)+'\n',encoding='utf-8')
          (ud/'update_status.json').write_text(json.dumps({'latest_version':'9.9.5','local_version':'9.9.5','notes':'V9.9.5 HotHelperCorrection candidate','state':'up_to_date'},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          out=Path('out'); out.mkdir(exist_ok=True)
          dst=out/'NghiaClient_V9.9.5_HotHelperCorrection_Windows_Candidate.zip'
          with ZipFile(dst,'w',ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root).as_posix())
          sha=hashlib.sha256(dst.read_bytes()).hexdigest()
          root_xml=ET.parse('v995-junit.xml').getroot()
          suite=root_xml if root_xml.tag == 'testsuite' else root_xml.find('testsuite')
          if suite is None: raise SystemExit(f'unexpected JUnit root: {root_xml.tag}')
          tests=int(suite.attrib.get('tests','0'))
          failures=int(suite.attrib.get('failures','0'))
          errors=int(suite.attrib.get('errors','0'))
          if (tests,failures,errors)!=(43,0,0): raise SystemExit((tests,failures,errors))
          report={'version':'9.9.5','variant':'AllMapWorkerParityHotHelperCorrection','tests':tests,'failures':failures,'errors':errors,'compileall':True,'nuitka_build':True,'windows_launcher_smoke':True,'packaged_launcher_smoke':False,'portable_sha256':sha,'public_publish_performed':False}
          (out/'preflight_report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          (out/'preflight_hashes.txt').write_text(f'{dst.name} {sha}\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          '@ | python -

      - name: Smoke packaged candidate again
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force verify/package | Out-Null
          Expand-Archive out/NghiaClient_V9.9.5_HotHelperCorrection_Windows_Candidate.zip -DestinationPath verify/package -Force
          $root=(Resolve-Path 'verify/package').Path
          $crash=Join-Path $root 'user_data/launcher_crash.log'
          if (Test-Path $crash) { Remove-Item $crash -Force }
          $lp=Start-Process -FilePath (Join-Path $root 'NghiaLauncher.exe') -WorkingDirectory $root -PassThru
          $deadline=(Get-Date).AddSeconds(35); $app=$null
          while ((Get-Date) -lt $deadline) {
            $apps=@(Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)
            if ($apps.Count -gt 0) { $app=$apps[0]; break }
            if (Test-Path $crash) { Get-Content $crash; throw 'packaged launcher crash log created' }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $app) { throw 'packaged NghiaClientApp.exe did not start' }
          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) { throw 'packaged app exited during stability window' }
          Write-Host "V995_HOTHELPER_PACKAGED_WINDOWS_LAUNCH_OK PID=$($app.Id)"
          @((Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)) | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          if (!$lp.HasExited) { Stop-Process -Id $lp.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $crash) { throw 'packaged launcher_crash.log exists after smoke' }
          @'
          from pathlib import Path
          import json
          p=Path('out/preflight_report.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          r['packaged_launcher_smoke']=True
          p.write_text(json.dumps(r,indent=2)+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload verified Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: Nghia-V9.9.5-HotHelperCorrection-Windows-Candidate
          path: |
            out/NghiaClient_V9.9.5_HotHelperCorrection_Windows_Candidate.zip
            out/preflight_report.json
            out/preflight_hashes.txt
            v995-junit.xml
          if-no-files-found: error
