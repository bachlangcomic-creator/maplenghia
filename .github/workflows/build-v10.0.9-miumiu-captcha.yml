name: Test Nghia V10.0.9 MiuMiu Timer + CAPTCHA Client Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-v10.0.9-miumiu-captcha.yml'
      - 'build_input/v1009_*'
      - 'build_input/nghia_watchdog_client_capture.py'
      - 'build_input/test_v1009_features.py'
      - 'build_input/RELEASE_NOTES_v10.0.9.md'

permissions:
  contents: write

jobs:
  source-regression-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Prepare verified V10.0.8 stable base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base | Out-Null
          gh release download v10.0.8 --repo $env:GITHUB_REPOSITORY `
            -p NghiaClient_V10.0.8_AdaptiveY_MapAware_Windows.zip -D base
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.8 base download failed' }
          $zip='base/NghiaClient_V10.0.8_AdaptiveY_MapAware_Windows.zip'
          $got=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='3959de9f241fc540e99ecfaf6d2238dad377a04a56922713a44e29e3a5368a33'
          if ($got -ne $expected) { throw "V10.0.8 base hash mismatch $got" }
          Expand-Archive $zip -DestinationPath portable -Force

      - name: Apply guarded V10.0.9 source patch
        shell: pwsh
        run: |
          python build_input/v1009_apply.py portable
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.9 patch failed' }
          python build_input/v1009_verify.py portable/app_payload
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.9 verification failed' }

      - name: Install regression dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest

      - name: Compile and run V10.0.9 regressions
        shell: pwsh
        run: |
          python -m compileall -q portable/app_payload build_input/v1009_apply.py build_input/v1009_verify.py build_input/nghia_watchdog_client_capture.py build_input/test_v1009_features.py
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }

          python -m pytest -q build_input/test_v1009_features.py
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.9 feature tests failed' }

          python -m pytest -q build_input/test_v1008_adaptive_y_map_toggle.py -k "not version_metadata_present"
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.8 Adaptive Y behavior regression failed' }

          python -m pytest -q build_input/test_v1006_stop_nonblocking.py
          if ($LASTEXITCODE -ne 0) { throw 'STOP Non-Blocking regression failed' }

          New-Item -ItemType Directory -Force candidate | Out-Null
          Copy-Item portable/app_payload candidate/app_payload -Recurse -Force
          New-Item -ItemType Directory -Force candidate/portable | Out-Null
          Copy-Item portable/app_payload candidate/portable/app_payload -Recurse -Force
          Copy-Item build_input/v1006_antijitter_tests candidate/tests -Recurse -Force
          python -m pytest -q candidate/tests --junitxml=v1009-antijitter-junit.xml
          if ($LASTEXITCODE -ne 0) { throw 'Anti-Jitter regression tests failed' }
          @'
          import xml.etree.ElementTree as ET
          root=ET.parse('v1009-antijitter-junit.xml').getroot()
          suite=root if root.tag=='testsuite' else root.find('testsuite')
          if suite is None:
              raise SystemExit('unexpected JUnit root')
          got=(int(suite.attrib.get('tests','0')), int(suite.attrib.get('failures','0')), int(suite.attrib.get('errors','0')))
          if got != (17,0,0):
              raise SystemExit(f'unexpected Anti-Jitter test result {got}')
          print('V1009_ANTIJITTER_17_TESTS_OK')
          '@ | python -

          python build_input/v1009_verify.py portable/app_payload
          if ($LASTEXITCODE -ne 0) { throw 'final V10.0.9 source verification failed' }

      - name: Keep V10.0.9 classified as test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v10.0.9 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit v10.0.9 --repo $env:GITHUB_REPOSITORY `
              --prerelease --latest=false `
              --title 'Nghia Client v10.0.9 TEST - MiuMiu Timer + CAPTCHA Client Capture'
            if ($LASTEXITCODE -ne 0) { throw 'failed to mark v10.0.9 as test/prerelease' }
          }

          $b64 = gh api "repos/$env:GITHUB_REPOSITORY/contents/latest.json" --jq '.content'
          $text = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($b64 -replace '\s','')))
          $obj = $text | ConvertFrom-Json
          if ($obj.version -ne '10.0.8') { throw "stable latest.json must remain 10.0.8 during V10.0.9 testing; got $($obj.version)" }
          Write-Host 'V1009_TEST_ONLY_OK stable=10.0.8'
