name: Build Nghia V9.9.6 CoordinateMapBuilder Windows Candidate

on:
  push:
    branches:
      - build-v9.9.6-coordinate-map-builder
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: bachlangcomic-creator/maplenghia
  BASE_TAG: v9.9.6
  BASE_ASSET: NghiaClient_V9.9.6_Portable.zip
  BASE_ASSET_SHA256: 15d4ff990c9cfef6d2179b324ba9c365f0b4629fe9d4475bef40ee7145d51361
  PATCH: build_input/v996-coordinate-map-windows.patch
  PATCH_SHA256: fdeb3f41231ca06fbdd2d677fcfcf9e89509fa32be1886b4766935c5e2818b5d
  BASE_MAPLE_SHA256: cec60e1575ed3ef05737acd2faf7eb2b42ca9fdcc6a5fb84c7ba169fe793c632
  BASE_UI_SHA256: 0de2fb008a38e1a0d54a6960cd3a9fa0af1fef46c8eca92aa27129b2801b624a
  EXPECTED_MAPLE_SHA256: 3eb783852cb6fdb95571b377acecb3506b2bfd0cf43b6fe744984665724131b9
  EXPECTED_UI_SHA256: b74188dd9b34f7c0e67c366625c0b0ff4de3e03c75f7b50df801f279faee262c
  EXPECTED_MAPS_SHA256: 52364dc3a284e051a04263b49e008caf699de9127cc62c8c59b7a8bb6533671d

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force deterministic LF checkout
        shell: pwsh
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git reset --hard HEAD

      - name: Setup Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Download verified V9.9.6 portable baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base,portable,out,verify | Out-Null
          gh release download $env:BASE_TAG --repo $env:REPO -p $env:BASE_ASSET -D base
          if ($LASTEXITCODE -ne 0) { throw 'V9.9.6 portable baseline download failed' }
          $zip = Join-Path base $env:BASE_ASSET
          $got=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $env:BASE_ASSET_SHA256) { throw "baseline zip hash mismatch $got" }
          Expand-Archive $zip -DestinationPath portable -Force
          if (!(Test-Path portable/app_payload/maple_nghia_pro.py)) { throw 'baseline source missing maple_nghia_pro.py' }
          if (!(Test-Path portable/app_payload/nghia_spotify_nologin.py)) { throw 'baseline source missing nghia_spotify_nologin.py' }
          Write-Host 'V996_BASELINE_PORTABLE_OK'

      - name: Apply CoordinateMapBuilder patch
        shell: pwsh
        run: |
          $patchHash=(Get-FileHash $env:PATCH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne $env:PATCH_SHA256) { throw "patch hash mismatch $patchHash" }
          $maple=(Get-FileHash portable/app_payload/maple_nghia_pro.py -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($maple -ne $env:BASE_MAPLE_SHA256) { throw "baseline maple hash mismatch $maple" }
          $ui=(Get-FileHash portable/app_payload/nghia_spotify_nologin.py -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ui -ne $env:BASE_UI_SHA256) { throw "baseline UI hash mismatch $ui" }
          git apply --check --directory=portable $env:PATCH
          if ($LASTEXITCODE -ne 0) { throw 'CoordinateMapBuilder patch check failed' }
          git apply --directory=portable $env:PATCH
          if ($LASTEXITCODE -ne 0) { throw 'CoordinateMapBuilder patch apply failed' }
          $maple=(Get-FileHash portable/app_payload/maple_nghia_pro.py -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($maple -ne $env:EXPECTED_MAPLE_SHA256) { throw "patched maple hash mismatch $maple" }
          $ui=(Get-FileHash portable/app_payload/nghia_spotify_nologin.py -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ui -ne $env:EXPECTED_UI_SHA256) { throw "patched UI hash mismatch $ui" }
          $maps=(Get-FileHash portable/app_payload/maps.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($maps -ne $env:EXPECTED_MAPS_SHA256) { throw "maps.json hash mismatch $maps" }
          Write-Host 'V996_COORDINATE_MAP_PATCH_OK'

      - name: Install test and Nuitka dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest "nuitka>=2.7,<3" ordered-set zstandard

      - name: Compile and verify active UI wiring
        shell: pwsh
        run: |
          python -m compileall -q portable/app_payload
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }
          @'
          import ast, json, os, tempfile
          from pathlib import Path
          root=Path('portable/app_payload')
          main=root/'maple_nghia_pro.py'
          ui=root/'nghia_spotify_nologin.py'
          main_text=main.read_text(encoding='utf-8')
          ui_text=ui.read_text(encoding='utf-8')
          assert 'LẤY TỌA ĐỘ / THÊM MAP' in main_text
          assert 'show_coordinate_map_builder' in main_text
          assert 'map_menu' in main_text
          assert 'LẤY TỌA ĐỘ / THÊM MAP' in ui_text
          assert 'command=self.show_coordinate_map_builder' in ui_text
          assert 'Nghia Edition V9.9.6' in ui_text
          assert 'NGHIA_LOCAL_VERSION", "9.9.6"' in ui_text
          tree=ast.parse(main_text)
          funcs={n.name:n for n in tree.body if isinstance(n,ast.FunctionDef)}
          for name in ('build_simple_map_profile','save_map_profile'):
              assert name in funcs
          ns={'Path':Path,'json':json,'os':os}
          for name in ('build_simple_map_profile','save_map_profile'):
              mod=ast.Module(body=[funcs[name]],type_ignores=[]); ast.fix_missing_locations(mod)
              exec(compile(mod,str(main),'exec'),ns)
          p=ns['build_simple_map_profile']((48.4,171.2),(183.49,170.8),(105.2,162.0))
          assert p == {'FARM_TYPE':'SIMPLE','LEFT_X':48,'LEFT_Y':171,'RIGHT_X':183,'RIGHT_Y':171,'SAFE_PLACE_X':105,'SAFE_PLACE_Y':162,'CHAR_MATCH_THRESHOLD':0.6}
          with tempfile.TemporaryDirectory() as td:
              target=Path(td)/'maps.json'
              merged=ns['save_map_profile'](target,{'C1':{'FARM_TYPE':'SIMPLE'}},'NEW',p)
              assert merged['NEW']==p
              assert json.loads(target.read_text(encoding='utf-8'))==merged
          print('V996_COORDINATE_MAP_ACTIVE_UI_TESTS_OK')
          '@ | python -

      - name: Rebuild NghiaClientApp.exe with Nuitka
        shell: pwsh
        run: |
          Push-Location portable/app_payload
          try {
            if (Test-Path dist_nuitka) { Remove-Item dist_nuitka -Recurse -Force }
            python -m nuitka `
              --onefile `
              --assume-yes-for-downloads `
              --windows-console-mode=disable `
              --enable-plugin=tk-inter `
              --include-package=customtkinter `
              --include-package-data=customtkinter `
              --include-module=client_paths `
              --include-module=client_update_bridge `
              --include-module=spotify_recovered_core `
              --include-module=spotify_recovered_api `
              --include-module=spotify_behavior_engine `
              --include-module=spotify_focus_parity `
              --include-module=spotify_detection_parity `
              --include-module=spotify_watchdog `
              --include-module=spotify_exact_assets `
              --include-module=spotify_miumiu_sell `
              --include-module=spotify_pc_alarm `
              --include-module=spotify_all_cure_assets `
              --include-module=spotify_all_cure_executor `
              --include-module=spotify_all_cure_market `
              --include-module=spotify_main_farm_orchestrator `
              --include-module=spotify_c2_runtime_support `
              --include-data-dir=spotify_miumiu=spotify_miumiu `
              --include-data-dir=evidence=evidence `
              --include-data-files=background.png=background.png `
              --include-data-files=maps.json=maps.json `
              --include-data-files=mushroom_icon.png=mushroom_icon.png `
              --include-data-files=mushroom_icon.ico=mushroom_icon.ico `
              --include-data-files=spotify_yellow_dot.png=spotify_yellow_dot.png `
              --windows-icon-from-ico=mushroom_icon.ico `
              --output-filename=NghiaClientApp.exe `
              --output-dir=dist_nuitka `
              nghia_spotify_nologin.py
            if ($LASTEXITCODE -ne 0) { throw 'Nuitka build failed' }
            if (!(Test-Path dist_nuitka/NghiaClientApp.exe)) { throw 'NghiaClientApp.exe missing' }
            Copy-Item dist_nuitka/NghiaClientApp.exe NghiaClientApp.exe -Force
          }
          finally { Pop-Location }
          @'
          from pathlib import Path
          exe=Path('portable/app_payload/NghiaClientApp.exe')
          data=exe.read_bytes()
          if not data.startswith(b'MZ'): raise SystemExit('not a PE/MZ executable')
          for marker in (b'pyiboot01_bootstrap',b'_MEIPASS',b'PYZ-00.pyz'):
              if marker in data: raise SystemExit(f'PyInstaller marker present: {marker!r}')
          print('V996_COORDINATE_MAP_NUITKA_PE_OK', exe.stat().st_size)
          '@ | python -

      - name: Windows launcher smoke
        shell: pwsh
        run: |
          $root=(Resolve-Path 'portable').Path
          $ud=Join-Path $root 'user_data'
          New-Item -ItemType Directory -Force $ud | Out-Null
          $crash=Join-Path $ud 'launcher_crash.log'
          if (Test-Path $crash) { Remove-Item $crash -Force }
          $lp=Start-Process -FilePath (Join-Path $root 'NghiaLauncher.exe') -WorkingDirectory $root -PassThru
          $deadline=(Get-Date).AddSeconds(35); $app=$null
          while ((Get-Date) -lt $deadline) {
            $apps=@(Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)
            if ($apps.Count -gt 0) { $app=$apps[0]; break }
            if (Test-Path $crash) { Get-Content $crash; throw 'launcher crash log created' }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $app) { throw 'NghiaClientApp.exe did not start within 35 seconds' }
          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) { throw 'NghiaClientApp.exe exited during stability window' }
          Write-Host "V996_COORDINATE_MAP_WINDOWS_LAUNCH_OK PID=$($app.Id)"
          @((Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)) | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          if (!$lp.HasExited) { Stop-Process -Id $lp.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $crash) { throw 'launcher_crash.log exists after smoke' }

      - name: Package Windows candidate
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, json, shutil
          root=Path('portable')
          shutil.rmtree(root/'app_payload'/'dist_nuitka',ignore_errors=True)
          for d in list(root.rglob('__pycache__')): shutil.rmtree(d,ignore_errors=True)
          for d in list(root.rglob('.pytest_cache')): shutil.rmtree(d,ignore_errors=True)
          ud=root/'user_data'; ud.mkdir(exist_ok=True)
          crash=ud/'launcher_crash.log'
          if crash.exists(): crash.unlink()
          (root/'version.json').write_text(json.dumps({'version':'9.9.6'},indent=2)+'\n',encoding='utf-8')
          (ud/'update_status.json').write_text(json.dumps({'latest_version':'9.9.6','local_version':'9.9.6','notes':'V9.9.6 CoordinateMapBuilder Windows candidate','state':'up_to_date'},indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          out=Path('out'); out.mkdir(exist_ok=True)
          dst=out/'NghiaClient_V9.9.6_CoordinateMapBuilder_Windows_Candidate.zip'
          with ZipFile(dst,'w',ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root).as_posix())
          sha=hashlib.sha256(dst.read_bytes()).hexdigest()
          report={'version':'9.9.6','variant':'CoordinateMapBuilderActiveUIFix','local_source_suite':{'tests':51,'failures':0,'errors':0},'windows_compileall':True,'active_ui_feature_checks':True,'nuitka_build':True,'windows_launcher_smoke':True,'packaged_launcher_smoke':False,'portable_sha256':sha,'maple_nghia_pro_sha256':'3eb783852cb6fdb95571b377acecb3506b2bfd0cf43b6fe744984665724131b9','nghia_spotify_nologin_sha256':'b74188dd9b34f7c0e67c366625c0b0ff4de3e03c75f7b50df801f279faee262c','maps_sha256':'52364dc3a284e051a04263b49e008caf699de9127cc62c8c59b7a8bb6533671d','public_publish_performed':False}
          (out/'preflight_report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          (out/'preflight_hashes.txt').write_text(f'{sha}  {dst.name}\n',encoding='utf-8')
          print('V996_COORDINATE_MAP_PACKAGE_OK', sha)
          '@ | python -

      - name: Packaged candidate launcher smoke
        shell: pwsh
        run: |
          Expand-Archive out/NghiaClient_V9.9.6_CoordinateMapBuilder_Windows_Candidate.zip -DestinationPath verify -Force
          $root=(Resolve-Path 'verify').Path
          $ud=Join-Path $root 'user_data'
          $crash=Join-Path $ud 'launcher_crash.log'
          if (Test-Path $crash) { Remove-Item $crash -Force }
          $lp=Start-Process -FilePath (Join-Path $root 'NghiaLauncher.exe') -WorkingDirectory $root -PassThru
          $deadline=(Get-Date).AddSeconds(35); $app=$null
          while ((Get-Date) -lt $deadline) {
            $apps=@(Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)
            if ($apps.Count -gt 0) { $app=$apps[0]; break }
            if (Test-Path $crash) { Get-Content $crash; throw 'packaged launcher crash log created' }
            Start-Sleep -Milliseconds 500
          }
          if ($null -eq $app) { throw 'packaged NghiaClientApp.exe did not start within 35 seconds' }
          Start-Sleep -Seconds 3
          $app.Refresh()
          if ($app.HasExited) { throw 'packaged NghiaClientApp.exe exited during stability window' }
          Write-Host "V996_COORDINATE_MAP_PACKAGED_LAUNCH_OK PID=$($app.Id)"
          @((Get-Process -Name NghiaClientApp -ErrorAction SilentlyContinue)) | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          if (!$lp.HasExited) { Stop-Process -Id $lp.Id -Force -ErrorAction SilentlyContinue }
          if (Test-Path $crash) { throw 'packaged launcher_crash.log exists after smoke' }
          @'
          from pathlib import Path
          import json
          p=Path('out/preflight_report.json')
          report=json.loads(p.read_text(encoding='utf-8'))
          report['packaged_launcher_smoke']=True
          p.write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload Windows candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nghia-V9.9.6-CoordinateMapBuilder-Windows-Candidate
          path: |
            out/NghiaClient_V9.9.6_CoordinateMapBuilder_Windows_Candidate.zip
            out/preflight_report.json
            out/preflight_hashes.txt
          if-no-files-found: error
          retention-days: 14
