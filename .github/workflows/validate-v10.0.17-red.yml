name: RED V10.0.17 SAFE ENTRY + Return To Farm

on:
  push:
    branches: [v10.0.17-safe-entry-return]
    paths:
      - '.github/workflows/validate-v10.0.17-red.yml'
      - 'build_input/test_v1017_safe_entry_return.py'
      - 'build_input/inspect_v1017_base.py'

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare exact V10.0.15 stable base
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force base | Out-Null
          gh release download v10.0.15 --repo $env:GITHUB_REPOSITORY `
            -p NghiaClient_V10.0.15_HumanRestMs_Windows.zip -D base
          if ($LASTEXITCODE -ne 0) { throw 'V10.0.15 base download failed' }
          $zip='base/NghiaClient_V10.0.15_HumanRestMs_Windows.zip'
          $got=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='5befa56f54c75b20aeaa8d9c9f1cf588bbad883e47b72f09cd02eaf88ebdcea8'
          if ($got -ne $expected) { throw "V10.0.15 base hash mismatch $got" }
          Expand-Archive $zip -DestinationPath portable -Force
      - name: Inspect exact V10.0.15 source anchors
        shell: pwsh
        run: python build_input/inspect_v1017_base.py portable/app_payload
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r portable/app_payload/requirements.txt pytest
      - name: RED - V10.0.15 must fail V10.0.17 feature tests
        shell: pwsh
        env:
          NGHIA_APP_DIR: portable/app_payload
        run: python -m pytest -q build_input/test_v1017_safe_entry_return.py
