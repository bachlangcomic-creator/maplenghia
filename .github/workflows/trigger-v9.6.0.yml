name: Trigger V9.6.0 publish at latest head

on:
  push:
    branches: [release-v9.6.0-mode-parity]
    paths: [".github/workflows/trigger-v9.6.0.yml"]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish workflow at latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-v9.6.0.yml --repo bachlangcomic-creator/maplenghia --ref release-v9.6.0-mode-parity
