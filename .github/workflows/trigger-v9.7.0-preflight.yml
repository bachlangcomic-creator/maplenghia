name: Trigger V9.7.0 Preflight Once

on:
  push:
    branches:
      - release-v9.7.0-detection-watchdog-parity

permissions:
  actions: write
  contents: read

jobs:
  dispatch-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch publish workflow with publish=false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # second push intentionally triggers this temporary dispatcher
          gh workflow run publish-v9.7.0.yml \
            --repo bachlangcomic-creator/maplenghia \
            --ref release-v9.7.0-detection-watchdog-parity \
            -f publish=false
