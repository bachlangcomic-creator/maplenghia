name: Inspect v9.5.0 source for v9.6

on:
  push:
    branches: [release-v9.6.0-mode-parity]
    paths: [".github/workflows/inspect-v9.5.0-source.yml"]

permissions:
  contents: read

env:
  REPO: bachlangcomic-creator/maplenghia

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v9.6.0-mode-parity

      - name: Download exact public v9.5.0 portable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base src
          gh release download v9.5.0 --repo "$REPO" -p NghiaClient_V9.5.0_Portable.zip -D base
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, shutil
          p=Path('base/NghiaClient_V9.5.0_Portable.zip')
          want='1fa0af1193ba49e4a056b70eb5f6a82b1a61b6f2f38c7b8b0cc825490d9ad013'
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got != want:
              raise SystemExit(f'portable hash mismatch: {got} != {want}')
          with zipfile.ZipFile(p) as z:
              for name in (
                  'app_payload/maple_nghia_pro.py',
                  'app_payload/spotify_behavior_engine.py',
                  'app_payload/spotify_recovered_core.py',
                  'app_payload/spotify_timing_catalog.py',
                  'app_payload/spotify_focus_parity.py',
                  'app_payload/maps.json',
              ):
                  out=Path('src')/Path(name).name
                  out.write_bytes(z.read(name))
          print('V950_SOURCE_EXPORT_OK')
          PY

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v9.5.0-source-snapshot
          path: src/*
          if-no-files-found: error
          retention-days: 3
